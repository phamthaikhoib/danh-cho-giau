<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Một vườn hoa cho Ngọc Giàu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --sky1:#bfe2f6;--sky2:#e2f1fb;--sky3:#fdf4ec;--cloud:rgba(255,255,255,.85);
 --paper:#fffaf4;--ink:#4b3a40;--ink-soft:#7a6268;--accent:#d9577c;
 --btn:rgba(255,255,255,.78);--btn-ink:#5a4248;--hint:#4f4048;--hint-bg:rgba(255,255,255,.55);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
 --sky1:#1d2747;--sky2:#35416b;--sky3:#6a6a96;--cloud:rgba(220,220,255,.18);
 --paper:#f7eee6;--btn:rgba(35,28,48,.72);--btn-ink:#f4e8ee;--hint:#f2e6f0;--hint-bg:rgba(30,24,44,.5);}}
:root[data-theme="dark"]{color-scheme:dark;
 --sky1:#1d2747;--sky2:#35416b;--sky3:#6a6a96;--cloud:rgba(220,220,255,.18);
 --paper:#f7eee6;--btn:rgba(35,28,48,.72);--btn-ink:#f4e8ee;--hint:#f2e6f0;--hint-bg:rgba(30,24,44,.5);}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);overflow:hidden;
 font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
 -webkit-tap-highlight-color:transparent;user-select:none}
canvas{position:fixed;inset:0;touch-action:manipulation;cursor:pointer}
.cloud{position:fixed;background:var(--cloud);border-radius:999px;filter:blur(14px);pointer-events:none;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.intro{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 22px);text-align:center;pointer-events:none;
 font-family:"Dancing Script","Brush Script MT",cursive;font-size:clamp(26px,5.4vw,46px);color:var(--hint);
 opacity:0;transition:opacity 1.6s ease;padding:0 16px;text-shadow:0 1px 12px rgba(255,255,255,.35)}
.intro.show{opacity:1}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);
 background:var(--hint-bg);color:var(--hint);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
 padding:10px 18px;border-radius:999px;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .8s;pointer-events:none}
.hint.show{opacity:1}
.bar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);display:none;gap:10px}
.bar.show{display:flex}
.bar button{font:500 14px/1 "Be Vietnam Pro",system-ui,sans-serif;color:var(--btn-ink);background:var(--btn);border:0;
 padding:12px 18px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
 box-shadow:0 4px 18px rgba(80,40,60,.15);white-space:nowrap}
.bar button:focus-visible,.close:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px 18px;
 background:rgba(60,40,60,.18);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .6s}
.overlay.show{opacity:1;pointer-events:auto}
.card{position:relative;width:min(440px,100%);max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);
 border-radius:6px;padding:34px 30px 26px;box-shadow:0 30px 60px -20px rgba(70,30,50,.45),0 2px 0 rgba(0,0,0,.03);
 transform:translateY(30px) rotate(-1.2deg) scale(.96);transition:transform .8s cubic-bezier(.2,.9,.25,1.2);text-align:center;
 background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(180,140,150,.10) 31px 32px)}
.overlay.show .card{transform:translateY(0) rotate(-1.2deg) scale(1)}
.card .mark{font-size:30px;line-height:1}
.greet{font-family:"Dancing Script",cursive;font-size:22px;color:var(--ink-soft);margin:12px 0 4px}
.head{font-family:"Dancing Script",cursive;font-weight:700;font-size:clamp(30px,7vw,38px);line-height:1.15;color:var(--accent);margin:0 0 18px;text-wrap:balance}
.card p{font-size:15px;line-height:1.75;margin:0 0 12px;min-height:1px;text-wrap:pretty}
.sign{font-family:"Dancing Script",cursive;font-size:24px;margin-top:16px;color:var(--ink)}
.close{position:absolute;top:10px;right:12px;border:0;background:none;font-size:22px;color:var(--ink-soft);cursor:pointer;padding:6px 10px;border-radius:6px}
.caret::after{content:"";display:inline-block;width:1px;height:1em;background:var(--ink-soft);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.cloud{animation:none}}
</style>
</head>
<body>
<canvas id="garden" aria-label="Vườn hoa, chạm để trồng thêm hoa"></canvas>
<div class="intro" id="intro"></div>
<div class="hint" id="hint"></div>
<div class="bar" id="bar">
  <button id="reread">Đọc lại thiệp</button>
  <button id="bloom">Cho hoa nở khắp vườn</button>
</div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Thiệp chúc mừng">
  <div class="card" id="card">
    <button class="close" id="close" aria-label="Đóng thiệp">×</button>
    <div class="mark">🌹</div>
    <div class="greet" id="greet"></div>
    <h1 class="head" id="headline"></h1>
    <div id="body"></div>
    <div class="sign" id="sign"></div>
  </div>
</div>
<script>
const C = {"intro": "Dành cho Giàu, có một vườn hoa nhỏ", "types": ["rose"], "heroType": "rose", "need": 5, "stem": "#6aa877", "leaf": "#86c391", "grass": "rgba(120,180,130,.55)", "hero": {"petal": "#f8c3cf", "dark": "#eea5b6", "light": "#fde3e9", "line": "rgba(160,90,110,.28)"}, "palette": [{"petal": "#f8c3cf", "dark": "#eea5b6", "light": "#fde3e9", "line": "rgba(160,90,110,.28)"}, {"petal": "#f9d0c2", "dark": "#f0b19c", "light": "#fde8df", "line": "rgba(160,100,80,.28)"}, {"petal": "#fbf0f1", "dark": "#ecd8db", "light": "#ffffff", "line": "rgba(150,110,120,.25)"}, {"petal": "#f8e3b8", "dark": "#eccf92", "light": "#fdf2da", "line": "rgba(150,120,60,.25)"}], "greeting": "Gửi Ngọc Giàu,",
  "headline": "Chúc mày 20/10 rực rỡ và sống sót qua đống deadline!",
  "paras": [
    "Chúc mày 20/10 luôn tươi tắn, đầu óc minh mẫn để tiêu diệt gọn gàng mấy cái bài báo cáo đợt này nha =))",
    "Tặng mày vườn hoa này đấy =))"
  ], "sign": "Từ Khôi"};
document.getElementById('intro').textContent = C.intro;
const cv=document.getElementById('garden'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W,H,U;
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;
 cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(d,0,0,d,0,0);U=Math.max(.65,Math.min(1.5,Math.min(W,H*.9)/560));}
resize();addEventListener('resize',resize);
// clouds
for(let i=0;i<5;i++){const c=document.createElement('div');c.className='cloud';const w=120+Math.random()*220;
 c.style.cssText=`width:${w}px;height:${w*.32}px;top:${4+Math.random()*30}%;animation-duration:${60+Math.random()*60}s;animation-delay:${-Math.random()*90}s`;document.body.prepend(c);}
const R=(a,b)=>a+Math.random()*(b-a),P=a=>a[Math.floor(Math.random()*a.length)];
const easeOut=t=>1-Math.pow(1-t,3);
const elastic=t=>t<=0?0:t>=1?1:Math.pow(2,-9*t)*Math.sin((t*10-.75)*(2*Math.PI)/3.2)+1;
const flowers=[],fx=[];
function addFlower(x,o={}){
 if(flowers.length>140)return;
 const depth=o.depth??Math.random();
 const f={x,depth,t0:performance.now()+(o.delay||0),type:o.type||P(C.types),c:o.c||P(C.palette),
  by:H*(1.02-(1-depth)*.14),h:o.h||H*R(.16,.40)*(.75+.35*depth),r:o.r||R(17,27)*U*(.6+.65*depth),
  bend:R(-1,1)*24*U,ph:Math.random()*6.28,rot:Math.random()*6.28,
  leaves:[{t:R(.25,.4),s:-1},{t:R(.45,.62),s:1}]};
 f.stem=C.stem;f.leaf=C.leaf;
 let i=flowers.length;while(i>0&&flowers[i-1].depth>depth)i--;flowers.splice(i,0,f);return f;}
function leaf(x,y,s,len,col){ctx.save();ctx.translate(x,y);ctx.rotate(s>0?-.55:Math.PI+.55);ctx.fillStyle=col;
 ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(len*.5,-len*.38,len,0);ctx.quadraticCurveTo(len*.5,len*.38,0,0);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(len*.1,0);ctx.lineTo(len*.85,0);ctx.stroke();ctx.restore();}
function rose(r,c){
 for(let i=0;i<6;i++){ctx.save();ctx.rotate(i*Math.PI/3);ctx.fillStyle=c.dark;ctx.beginPath();ctx.ellipse(r*.45,0,r*.6,r*.48,0,0,7);ctx.fill();ctx.restore();}
 for(let i=0;i<6;i++){ctx.save();ctx.rotate(i*Math.PI/3+.5);ctx.fillStyle=c.petal;ctx.beginPath();ctx.ellipse(r*.36,0,r*.5,r*.4,0,0,7);ctx.fill();
  ctx.strokeStyle=c.line;ctx.lineWidth=Math.max(.6,r*.03);ctx.stroke();ctx.restore();}
 const n=12;for(let i=0;i<n;i++){const k=1-i/n;ctx.save();ctx.rotate(i*2.4);ctx.fillStyle=i%2?c.petal:c.light;
  ctx.beginPath();ctx.ellipse(r*.1*k,0,r*.52*k,r*.4*k,0,0,7);ctx.fill();
  ctx.strokeStyle=c.line;ctx.lineWidth=Math.max(.6,r*.025);ctx.beginPath();ctx.arc(r*.1*k,0,r*.44*k,-1.3,1.3);ctx.stroke();ctx.restore();}
 ctx.fillStyle=c.dark;ctx.beginPath();ctx.arc(0,0,r*.05,0,7);ctx.fill();}
function tpetal(w,h){ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(w*.95,-h*.1,w*.65,-h*.85,0,-h);ctx.bezierCurveTo(-w*.65,-h*.85,-w*.95,-h*.1,0,0);ctx.fill();}
function tulip(r,c){const h=r*1.55,w=r*.95;ctx.translate(0,r*.35);
 ctx.fillStyle=c.dark;ctx.save();ctx.rotate(-.32);tpetal(w,h);ctx.restore();ctx.save();ctx.rotate(.32);tpetal(w,h);ctx.restore();
 ctx.fillStyle=c.petal;tpetal(w*.95,h*1.04);
 ctx.fillStyle=c.light;ctx.globalAlpha=.6;ctx.save();ctx.scale(.45,.8);tpetal(w,h);ctx.restore();ctx.globalAlpha=1;
 ctx.strokeStyle=c.line;ctx.lineWidth=Math.max(.6,r*.03);ctx.beginPath();ctx.moveTo(0,-h*.15);ctx.lineTo(0,-h*.85);ctx.stroke();}
function daisy(r,c){const n=16;ctx.rotate(.1);
 for(let i=0;i<n;i++){ctx.save();ctx.rotate(i*Math.PI*2/n);ctx.fillStyle=i%2?c.petal:c.light;ctx.beginPath();
  ctx.ellipse(r*.55,0,r*.5,r*.15,0,0,7);ctx.fill();ctx.strokeStyle=c.line;ctx.lineWidth=.7;ctx.stroke();ctx.restore();}
 const g=ctx.createRadialGradient(-r*.08,-r*.08,1,0,0,r*.32);g.addColorStop(0,'#ffe9a3');g.addColorStop(1,'#f0b43c');
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r*.3,0,7);ctx.fill();
 ctx.fillStyle='rgba(160,90,20,.45)';for(let i=0;i<10;i++){const a=i*2.4,d=r*.18*Math.sqrt(i/10);ctx.beginPath();ctx.arc(Math.cos(a)*d,Math.sin(a)*d,r*.025,0,7);ctx.fill();}}
function drawFlower(f,now){
 const age=now-f.t0;if(age<0)return;
 const p=easeOut(Math.min(age/1300,1)),sway=Math.sin(now*.0011+f.ph)*f.r*.18*p;
 const x0=f.x,y0=f.by,x2=f.x+f.bend+sway,y2=f.by-f.h,x1=f.x+f.bend*.2,y1=f.by-f.h*.5;
 const q=t=>[(1-t)**2*x0+2*(1-t)*t*x1+t*t*x2,(1-t)**2*y0+2*(1-t)*t*y1+t*t*y2];
 ctx.strokeStyle=f.stem;ctx.lineWidth=Math.max(1.6,f.r*.11);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x0,y0);
 for(let i=1;i<=18;i++){const[x,y]=q(p*i/18);ctx.lineTo(x,y);}ctx.stroke();
 for(const L of f.leaves){if(p<L.t)continue;const g=Math.min((p-L.t)/.25,1),[lx,ly]=q(L.t);leaf(lx,ly,L.s,f.r*1.15*g,f.leaf);}
 const b=elastic(Math.min(Math.max((age-1000)/1200,0),1));
 if(b>0){const[hx,hy]=q(p);ctx.save();ctx.translate(hx,hy);ctx.rotate(f.type==='tulip'?sway*.01:f.rot+sway*.02);ctx.scale(b,b);
  (f.type==='rose'?rose:f.type==='tulip'?tulip:daisy)(f.r,f.c);ctx.restore();}}
function spawnPetal(x,y,burst){const c=P(C.palette);fx.push({x:x??R(0,W),y:y??-10,vx:burst?R(-1.8,1.8):R(-.2,.5),vy:burst?R(-2.5,-.5):R(.4,1),
 rot:R(0,6),vr:R(-.05,.05),s:R(3,6)*U,col:c.petal,life:0});}
let last=performance.now();
function frame(now){const dt=Math.min((now-last)/16.7,3);last=now;ctx.clearRect(0,0,W,H);
 const g=ctx.createLinearGradient(0,H*.82,0,H);g.addColorStop(0,'rgba(130,190,140,0)');g.addColorStop(1,C.grass);ctx.fillStyle=g;ctx.fillRect(0,H*.82,W,H*.18);
 for(const f of flowers)drawFlower(f,now);
 if(!reduce&&Math.random()<.04*dt&&fx.length<60)spawnPetal();
 for(let i=fx.length-1;i>=0;i--){const p=fx[i];p.life+=dt;p.vy+=.02*dt;p.vy=Math.min(p.vy,1.3);p.x+=(p.vx+Math.sin((p.life+p.rot*40)*.03)*.4)*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
  if(p.y>H+20||p.x<-30||p.x>W+30){fx.splice(i,1);continue;}
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.col;ctx.globalAlpha=.85;ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.6,0,0,7);ctx.fill();ctx.restore();}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);
// flow
const intro=document.getElementById('intro'),hint=document.getElementById('hint'),bar=document.getElementById('bar'),ov=document.getElementById('overlay');
let left=C.need,opened=false,typing=null;
function setHint(){hint.textContent=left>0?`Chạm vào màn hình để trồng hoa · còn ${left} bông nữa là mở thiệp`:'';}
addFlower(W/2,{depth:1.15,h:H*.46,r:34*U*1.25,type:C.heroType,c:C.hero});
[[.2,400],[.8,700],[.35,1000],[.66,1300]].forEach(([x,d])=>addFlower(W*x,{delay:d,depth:R(.1,.5)}));
setTimeout(()=>intro.classList.add('show'),1600);
setTimeout(()=>{setHint();hint.classList.add('show');},3400);
cv.addEventListener('pointerdown',e=>{
 const d=Math.max(0,Math.min(1,(e.clientY/H-.35)/.6));addFlower(e.clientX,{depth:d});
 for(let i=0;i<6;i++)spawnPetal(e.clientX,e.clientY,true);
 if(!opened){left--;setHint();if(left<=0){hint.classList.remove('show');bloomAll(16);setTimeout(openCard,2200);}}});
function bloomAll(n){for(let i=0;i<n;i++)addFlower(R(.03,.97)*W,{delay:i*110});for(let i=0;i<20;i++)setTimeout(()=>spawnPetal(),i*60);}
function openCard(){opened=true;bar.classList.remove('show');ov.classList.add('show');
 document.getElementById('greet').textContent=C.greeting;document.getElementById('headline').textContent=C.headline;
 const body=document.getElementById('body'),sign=document.getElementById('sign');body.innerHTML='';sign.textContent='';
 const ps=C.paras.map(()=>{const p=document.createElement('p');body.appendChild(p);return p;});
 clearInterval(typing);let pi=0,ci=0;
 const finish=()=>{clearInterval(typing);typing=null;ps.forEach((p,i)=>{p.textContent=C.paras[i];p.classList.remove('caret')});sign.textContent=C.sign;};
 if(reduce){finish();return;}
 setTimeout(()=>{typing=setInterval(()=>{if(pi>=ps.length){finish();return;}
  const t=C.paras[pi];ci++;ps[pi].textContent=t.slice(0,ci);ps.forEach(p=>p.classList.remove('caret'));ps[pi].classList.add('caret');
  if(ci>=t.length){pi++;ci=0;}},32);},700);
 document.getElementById('card').onclick=e=>{if(typing&&e.target.id!=='close')finish();};
 document.getElementById('close').focus({preventScroll:true});}
function closeCard(){ov.classList.remove('show');bar.classList.add('show');}
document.getElementById('close').onclick=closeCard;
ov.addEventListener('pointerdown',e=>{if(e.target===ov)closeCard();});
addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('show'))closeCard();});
document.getElementById('reread').onclick=openCard;
document.getElementById('bloom').onclick=()=>bloomAll(22);
</script>
</body>
</html>
